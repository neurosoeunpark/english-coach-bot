name: Daily English Coach

# 실행 시각은 cron-job.org가 정확히 맞춰서 호출한다 (GitHub 자체 예약은 몇 시간씩 밀릴 수 있어 사용 안 함)
#   월~금 18:40 KST → mode=prep
#   화~토 08:00 KST → mode=morning (복습 카드 + 오늘의 아티클, 각각 별도 메시지)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'prep=치트시트 / morning=복습+아티클 / review / articles / sources=소스 점검'
        type: choice
        options: [prep, morning, review, articles, sources]
        default: prep

permissions:
  contents: write   # data/*.json 커밋용

concurrency:
  group: english-coach
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run coach bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_ORDER: ${{ vars.LLM_ORDER }}
          CLASS_TIME: ${{ vars.CLASS_TIME }}
          ARTICLE_WEIGHTS: ${{ vars.ARTICLE_WEIGHTS }}
          ENGOO_LIST_URL: ${{ vars.ENGOO_LIST_URL }}
        run: python scripts/send_cheat_sheet.py --mode ${{ inputs.mode }}

      - name: Commit history
        if: always() && inputs.mode != 'sources'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: ${{ inputs.mode }} $(TZ=Asia/Seoul date +%F)"
            git pull --rebase origin main
            git push
          fi
